name = "neural-update-cron"
main = "worker.js"
compatibility_date = "2026-08-29"

# Horários em UTC. Os posts saem 08h, 14h, 18h e 21h BRT = 11, 17, 21 e 00 UTC.
# Dispara 10 min DEPOIS de cada horário: o publicador só solta o que já venceu,
# então adiantar não publica cedo — atrasar um pouco garante que já venceu.
# O segundo disparo de cada slot é a rede: se o GitHub estiver congestionado no
# primeiro, o de 40 min depois pega.
[triggers]
crons = [
  "10,50 11 * * *",   # 08h BRT
  "10,50 17 * * *",   # 14h BRT
  "10,50 21 * * *",   # 18h BRT
  "10,50 0  * * *",   # 21h BRT
]
