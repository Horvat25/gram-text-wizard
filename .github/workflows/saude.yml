name: Saúde do publicador

# O apagão de 10/ago/2026 durou dez horas porque NINGUÉM estava olhando: os posts
# das 14h e 18h simplesmente não saíram e só foi notado à noite, pelo feed.
# Este workflow é o batimento cardíaco. Quando ele falha, o GitHub manda email.

on:
  schedule:
    # ⚠️ 28/08/2026: era um disparo só por dia (12:00Z) e isso deixou o canal cego.
    # Em 27 e 28/08 o cron do GitHub engasgou, o publicador parou — e o vigia parou
    # junto, porque depende do MESMO cron. Resultado: 4 posts morreram sem aviso, e
    # quem descobriu foi o Marcelo olhando o feed.
    # Três disparos espalhados pelo dia: se um for engolido, os outros ainda gritam.
    - cron: '0 12,19,2 * * *'    # 09h, 16h e 23h BRT
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Token vivo e com prazo?
        env:
          IG_USER_ID: '17841478894893058'   # @neuralupdate — identificador publico, nao e segredo
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}   # 14/09/2026: chave so de leitura das views do Facebook
        run: node publicador/conferir-token.mjs

      - name: Ficou algum post pra trás?
        run: node publicador/conferir-fila.mjs

      - name: Facebook publicou os Reels?
        run: node publicador/conferir-facebook.mjs
