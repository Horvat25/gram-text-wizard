name: Facebook bonus 2026-11-25
on:
  push:
    branches: [main]
    paths: [publicador/fb-bonus-25nov/manifest.json]
  workflow_dispatch:
concurrency:
  group: fb-bonus-25nov
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 25 Reels curtos so na Pagina (bonus 25-26nov)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          git config user.name 'FB bonus publisher'
          git config user.email 'publisher@users.noreply.github.com'
          git pull --rebase origin main
          node publicador/fb-bonus-25nov.mjs
