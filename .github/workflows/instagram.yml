name: Publicador Instagram

# Substitui o pg_cron que morava dentro do Supabase. A lição de 10/ago/2026:
# fila e carteiro não podem morar no mesmo lugar — quando o banco caiu, os dois
# sumiram juntos e o canal parou no meio do dia sem ninguém perceber.

on:
  schedule:
    # Os posts saem 08h, 14h e 18h BRT = 11:00, 17:00 e 21:00 UTC — os mesmos
    # horários do YouTube, porque o Instagram ESPELHA o YouTube (mesmo vídeo,
    # mesmo dia, mesma hora).
    #
    # ⏰ MEDIDO em 13/08/2026, depois de o Marcelo ver post saindo à meia-noite:
    # o agendador do GitHub SEMPRE atrasa. Nos posts reais o atraso foi de 42 a
    # 57 min nos horários normais — e de 145 min no disparo de 01:00 UTC, porque
    # 01:00 é pico de cron no mundo todo. O post das 22h saiu 00:24 e 00:25.
    #
    # 1) O SLOT DAS 22h FOI REMOVIDO. Madrugada é onde está todo flop histórico
    #    do canal (PLAYBOOK-SHORTS). Atrasado agora espera o próximo slot normal.
    # 2) Os disparos começam na HORA ANTERIOR ao post. Assim, com o atraso
    #    habitual, a primeira execução cai logo DEPOIS da hora marcada em vez de
    #    quase uma hora depois. O publicador só solta o que já venceu, então
    #    disparo adiantado não publica nada cedo — só fica pronto.
    #
    # Alvos: 08h, 14h e 18h BRT = 11:00, 17:00 e 21:00 UTC.
    # ⚠️ NÃO voltar pra '*/15 * * * *': o GitHub cobra cada execução arredondada
    # pra 1 minuto, */15 dá 2.880 min/mês e o plano grátis tem 2.000.
    # Isto aqui dá 18 execuções/dia ≈ 540 min/mês.
    - cron: '5,25,45 10,11,16,17,20,21 * * *'
  workflow_dispatch:

# Uma execução por vez. Foi exatamente a falta disso (rodadas se sobrepondo)
# que travou o publicador antigo.
concurrency:
  group: publicador-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publicar o que venceu
        env:
          IG_USER_ID: '17841478894893058'   # @neuralupdate — identificador publico, nao e segredo
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_CONTA: neuralupdate
        run: node publicador/publicar.mjs

      - name: Guardar o estado da fila
        if: always()
        run: |
          set -e
          if [ -z "$(git status --porcelain publicador/fila.json)" ]; then
            echo "nada mudou na fila"; exit 0
          fi
          git config user.name  "publicador"
          git config user.email "publicador@users.noreply.github.com"

          # ⚠️ NAO empurrar por cima. Em 20/08/2026 um Reels saiu DUPLICADO: o push
          # desta etapa foi rejeitado (o agente commitou 1 min antes), o registro de
          # "publicado" se perdeu, e a rodada seguinte postou o mesmo video de novo.
          # Agora a gente RECONCILIA a cada tentativa: quem ja foi publicado ganha.
          cp publicador/fila.json /tmp/fila-minha.json
          for tentativa in 1 2 3 4 5; do
            git fetch -q origin main
            git reset --hard -q origin/main
            git show origin/main:publicador/fila.json > /tmp/fila-remota.json
            node publicador/funde-fila.mjs /tmp/fila-minha.json /tmp/fila-remota.json publicador/fila.json
            git add publicador/fila.json
            if git diff --cached --quiet; then echo "ja estava igual ao que ha no GitHub"; exit 0; fi
            git commit -q -m "fila: estado apos a rodada de $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then echo "estado salvo (tentativa $tentativa)"; exit 0; fi
            echo "push rejeitado — alguem chegou antes; refazendo a fusao"
            sleep 5
          done
          echo "::error::nao consegui salvar o estado da fila em 5 tentativas"
          exit 1
