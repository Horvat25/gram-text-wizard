name: Publicador Instagram

# Substitui o pg_cron que morava dentro do Supabase. A lição de 10/ago/2026:
# fila e carteiro não podem morar no mesmo lugar — quando o banco caiu, os dois
# sumiram juntos e o canal parou no meio do dia sem ninguém perceber.

on:
  schedule:
    # Os posts saem 08h, 14h e 18h BRT = 11:00, 17:00 e 21:00 UTC — os mesmos
    # horários do YouTube, porque o Instagram ESPELHA o YouTube (mesmo vídeo,
    # mesmo dia, mesma hora).
    #
    # ⏰ MEDIDO em 13/08/2026, depois de o Marcelo ver post saindo à meia-noite:
    # o agendador do GitHub SEMPRE atrasa. Nos posts reais o atraso foi de 42 a
    # 57 min nos horários normais — e de 145 min no disparo de 01:00 UTC, porque
    # 01:00 é pico de cron no mundo todo. O post das 22h saiu 00:24 e 00:25.
    #
    # 1) O SLOT DAS 22h FOI REMOVIDO. Madrugada é onde está todo flop histórico
    #    do canal (PLAYBOOK-SHORTS). Atrasado agora espera o próximo slot normal.
    # 2) Os disparos começam na HORA ANTERIOR ao post. Assim, com o atraso
    #    habitual, a primeira execução cai logo DEPOIS da hora marcada em vez de
    #    quase uma hora depois. O publicador só solta o que já venceu, então
    #    disparo adiantado não publica nada cedo — só fica pronto.
    #
    # Alvos: 08h, 14h e 18h BRT = 11:00, 17:00 e 21:00 UTC.
    # ⚠️ NÃO voltar pra '*/15 * * * *': o GitHub cobra cada execução arredondada
    # pra 1 minuto, */15 dá 2.880 min/mês e o plano grátis tem 2.000.
    # Isto aqui dá 18 execuções/dia ≈ 540 min/mês.
    # ⚠️ 21/08/2026: as horas 22 e 23 entraram porque o STORY DAS 20h BRT (23:00Z) nao
    # tinha cobertura nenhuma — o ultimo disparo do dia era 21:45Z. Ele so seria visto
    # as 10:05Z do dia seguinte, 11h depois, e o publicador descarta o que venceu ha
    # mais de 6h. Resultado: o story das 20h era marcado PERDIDO todo dia, em silencio.
    # Achado na fila: story-kindle-2026-08-20-23 -> perdido.
    # 24 execucoes/dia ~ 720 min/mes, dentro dos 2.000 do plano gratis.
    # ⚠️ 28/08/2026: a hora 00 (UTC) entrou para cobrir o slot das 21h BRT. Antes o último
    # disparo era 23:45Z (20h45 BRT) e qualquer post marcado para 00:00Z só era visto às
    # 10:05Z do dia seguinte — 10h depois, além da janela de 6h, ou seja, PERDIDO em silêncio.
    # É o mesmo buraco que matava o story das 20h. Não confundir com 01:00Z, que continua
    # fora de propósito: aquele horário é pico de cron no mundo todo e mediu 145 min de atraso.
    # ⚠️ 29/08/2026: o post das 08h nao saiu pela SEGUNDA manha seguida. O cron do GitHub
    # nao engole disparos soltos — ele engole PERIODOS INTEIROS. Hoje comeu as horas 10 e 11
    # inteiras (os seis disparos); ontem comeu a manha toda. Historico de rodadas efetivas:
    #   01h:1  04h:1  11h:4  17h:5  19h:1  20h:5  21h:4  23h:5
    # Reagendar (conserto de 28/08) nao basta: se o publicador nao RODA, nada acontece.
    # As horas 12,13,14,15 entraram como RECUPERACAO — se a janela das 10-11 falhar, o post
    # das 08h BRT sai com ~1h de atraso em vez de esperar as 16h (5h de buraco).
    # 39 disparos/dia ~1.170/mes. Uso medido em 28/08: 691 min de 2.000 (34%) -> vai a ~52%.
    - cron: '5,25,45 0,1,10,11,12,13,14,15,16,17,20,21,22,23 * * *'
  workflow_dispatch:

# Uma execução por vez. Foi exatamente a falta disso (rodadas se sobrepondo)
# que travou o publicador antigo.
concurrency:
  group: publicador-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # ⚠️ 13/09/2026: o relógio da nuvem (Worker) e a tarefa do PC disparam no MESMO minuto.
      # O concurrency só ENFILEIRA a 2ª rodada — e ela vinha com o checkout do momento do
      # disparo, a fila de ANTES da 1ª gravar "publicado". Resultado: o Reel das 18h e o Story
      # das 21h saíram 2x. Agora toda rodada pega a fila mais nova antes de publicar.
      - name: Pegar a fila mais nova
        run: git fetch -q origin main && git reset -q --hard origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Publicar o que venceu
        env:
          IG_USER_ID: '17841478894893058'   # @neuralupdate — identificador publico, nao e segredo
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_CONTA: neuralupdate
          FB_PAGE_ID: '962589380261249'     # Pagina Neural Update (13/09/2026: todo Reel sai tambem no Facebook)
        run: node publicador/publicar.mjs


      # Comentario do Kindle nos videos do YouTube que acabaram de ficar publicos.
      # Roda aqui, pendurado no workflow que ja existe, pra nao gastar minuto novo do
      # plano gratis. Leva `continue-on-error` porque falha no YouTube NUNCA pode travar
      # a fila do Instagram — o publicador e o que nao pode parar.
      #
      # O robo nunca comenta duas vezes: antes de escrever ele PERGUNTA ao YouTube se o
      # nosso proprio canal ja comentou naquele video. Checar a fonte e mais confiavel que
      # guardar estado em arquivo — arquivo se perde, e comentario repetido e vexame.
      #
      # ⚠️ Exige o escopo `youtube.force-ssl` no YT_REFRESH_TOKEN. Sem ele a API nega ate
      # a LEITURA dos comentarios (insufficientPermissions). Reautorizado em 21/08/2026.
      - name: Comentar nos Shorts que sairam
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node publicador/comenta-youtube.mjs
      - name: Testar roteador ROTINA do YouTube
        run: node publicador/responde-rotina-youtube.test.mjs
      - name: Responder ROTINA nos comentarios do YouTube
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node publicador/responde-rotina-youtube.mjs
      - name: Guardar o estado da fila
        if: always()
        run: |
          set -e
          if [ -z "$(git status --porcelain publicador/fila.json publicador/ultima-rodada.json)" ]; then
            echo "nada mudou na fila"; exit 0
          fi
          git config user.name  "publicador"
          git config user.email "publicador@users.noreply.github.com"

          # O batimento (ultima-rodada.json) precisa sobreviver ao reset da reconciliação
          # abaixo, senão o publicador nunca enxerga o buraco no cron — ver publicar.mjs.
          cp publicador/ultima-rodada.json /tmp/batimento.json 2>/dev/null || true

          # ⚠️ NAO empurrar por cima. Em 20/08/2026 um Reels saiu DUPLICADO: o push
          # desta etapa foi rejeitado (o agente commitou 1 min antes), o registro de
          # "publicado" se perdeu, e a rodada seguinte postou o mesmo video de novo.
          # Agora a gente RECONCILIA a cada tentativa: quem ja foi publicado ganha.
          cp publicador/fila.json /tmp/fila-minha.json
          for tentativa in 1 2 3 4 5; do
            git fetch -q origin main
            git reset --hard -q origin/main
            git show origin/main:publicador/fila.json > /tmp/fila-remota.json
            node publicador/funde-fila.mjs /tmp/fila-minha.json /tmp/fila-remota.json publicador/fila.json
            cp /tmp/batimento.json publicador/ultima-rodada.json 2>/dev/null || true
            git add publicador/fila.json publicador/ultima-rodada.json
            if git diff --cached --quiet; then echo "ja estava igual ao que ha no GitHub"; exit 0; fi
            git commit -q -m "fila: estado apos a rodada de $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then echo "estado salvo (tentativa $tentativa)"; exit 0; fi
            echo "push rejeitado — alguem chegou antes; refazendo a fusao"
            sleep 5
          done
          echo "::error::nao consegui salvar o estado da fila em 5 tentativas"
          exit 1

      # Roda depois de publicar E de salvar a fila. Se falhar, o post atual ja foi
      # processado e o estado ja chegou ao Git; o alarme nao bloqueia publicacoes.
      # As proximas rodadas continuam independentes e voltam a conferir a cada 20 min.
      - name: Alarmar 2 falhas seguidas no Facebook
        if: always()
        run: node publicador/conferir-facebook.mjs
