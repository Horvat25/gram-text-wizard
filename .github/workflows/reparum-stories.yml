name: Stories Reparum Tech

on:
  schedule:
    # Piracicaba (BRT, UTC-3): 09h, 14h e 17h.
    # :15 e :30 são tentativas de segurança; o estado impede duplicação.
    # As expressões ficam separadas para o workflow saber qual slot executar
    # mesmo se o GitHub atrasar o início do job.
    #
    # ⚠️ JANELA LARGA DE PROPÓSITO. O agendador do GitHub no plano gratuito
    # atrasa, e o atraso não é pequeno: em 13/08 o bloco das 9h só rodou 10h24,
    # 84 minutos depois. Com a janela antiga (3 tentativas em 30 min) o dia 14
    # passou em branco — o gatilho nem chegou a nascer dentro dela.
    # Agora são 6 tentativas cobrindo 100 minutos. O histórico anti-repetição
    # garante que só a primeira que pegar publica; as outras não fazem nada.
    - cron: '0,20,40 12,13 * * *'
    # 15,16 UTC = 12h e 13h BRT. Não tem slot de Story nesse horário: existe
    # só para o publicador de FEED, que roda em todas as rodadas. Sem isto um
    # post marcado para o meio-dia caía no vão entre os gatilhos e só saía às
    # 14h — foi o que aconteceu com o carrossel em 14/08.
    - cron: '0,20,40 15,16 * * *'
    - cron: '0,20,40 17,18 * * *'
    - cron: '0,20,40 20,21 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: Horário a executar; conferir-token não publica
        required: true
        default: validar
        type: choice
        options:
          - validar
          - conferir-token
          - auditar
          - conferir-dia
          - '09'
          - '14'
          - '17'

# Usa o mesmo grupo do publicador do canal porque os dois gravam estado no main.
concurrency:
  group: publicador-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validar ou publicar o slot
        env:
          IG_USER_ID: '17841433241008922'
          IG_TOKEN: ${{ secrets.IG_TOKEN_REPARUM }}
          IG_CONTA: reparumtech
          SLOT_MANUAL: ${{ github.event.inputs.slot }}
          CRON_AGENDADO: ${{ github.event.schedule }}
        run: |
          if [ "$SLOT_MANUAL" = "validar" ]; then
            node publicador/reparum-stories.mjs --validar
          elif [ "$SLOT_MANUAL" = "conferir-token" ]; then
            node publicador/reparum-stories.mjs --conferir-token
          elif [ "$SLOT_MANUAL" = "conferir-dia" ]; then
            node publicador/reparum-stories.mjs --conferir-dia
          elif [ "$SLOT_MANUAL" = "auditar" ]; then
            node publicador/reparum-stories.mjs --auditar
          elif [ -n "$SLOT_MANUAL" ]; then
            node publicador/reparum-stories.mjs --slot "$SLOT_MANUAL"
          elif [ "$CRON_AGENDADO" = "0,20,40 12,13 * * *" ]; then
            node publicador/reparum-stories.mjs --slot 09
          elif [ "$CRON_AGENDADO" = "0,20,40 15,16 * * *" ]; then
            echo 'gatilho do meio-dia: sem slot de Story, segue só para o feed'
          elif [ "$CRON_AGENDADO" = "0,20,40 17,18 * * *" ]; then
            node publicador/reparum-stories.mjs --slot 14
          elif [ "$CRON_AGENDADO" = "0,20,40 20,21 * * *" ]; then
            node publicador/reparum-stories.mjs --slot 17
          else
            echo "gatilho sem slot reconhecido; abortando por segurança"
            exit 1
          fi

      # Feed é datado e sai uma vez; Story é agenda que se repete. São filas
      # separadas de propósito. `if: always()` porque uma falha no Story não
      # pode impedir o post do feed — e vice-versa.
      - name: Publicar posts avulsos do feed
        if: always()
        env:
          IG_USER_ID: '17841433241008922'
          IG_TOKEN: ${{ secrets.IG_TOKEN_REPARUM }}
          IG_CONTA: reparumtech
        run: node publicador/reparum-feed.mjs

      # Roda depois de tudo: se algum slot do dia venceu há mais de 2h e não
      # foi publicado, este passo falha de propósito. Run vermelho no Actions =
      # e-mail do GitHub. Sem isso a falha some até alguém olhar o perfil.
      - name: Conferir se o dia saiu inteiro
        if: always()
        env:
          IG_USER_ID: '17841433241008922'
          IG_TOKEN: ${{ secrets.IG_TOKEN_REPARUM }}
          IG_CONTA: reparumtech
        run: node publicador/reparum-stories.mjs --conferir-dia

      - name: Guardar histórico anti-repetição
        if: always()
        run: |
          if [ -n "$(git status --porcelain publicador/reparum-estado.json publicador/reparum-feed.json)" ]; then
            git config user.name "publicador"
            git config user.email "publicador@users.noreply.github.com"
            git add publicador/reparum-estado.json publicador/reparum-feed.json
            git commit -m "reparum: estado após $(date -u +%Y-%m-%dT%H:%MZ)"
            # Outro workflow também versiona sua própria fila. Rebase evita que
            # uma mudança simultânea impeça o estado anti-repetição de chegar ao main.
            for tentativa in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "push concorreu com outra execução; tentativa $tentativa/3"
            done
            exit 1
          else
            echo "estado sem alteração"
          fi
