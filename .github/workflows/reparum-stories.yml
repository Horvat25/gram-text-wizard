name: Stories Reparum Tech

on:
  schedule:
    # Piracicaba (BRT, UTC-3): 09h, 14h e 17h.
    # :15 e :30 são tentativas de segurança; o estado impede duplicação.
    # As expressões ficam separadas para o workflow saber qual slot executar
    # mesmo se o GitHub atrasar o início do job.
    - cron: '0,15,30 12 * * *'
    - cron: '0,15,30 17 * * *'
    - cron: '0,15,30 20 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: Horário a executar; conferir-token não publica
        required: true
        default: validar
        type: choice
        options:
          - validar
          - conferir-token
          - auditar
          - '09'
          - '14'
          - '17'

# Usa o mesmo grupo do publicador do canal porque os dois gravam estado no main.
concurrency:
  group: publicador-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar ou publicar o slot
        env:
          IG_USER_ID: '17841433241008922'
          IG_TOKEN: ${{ secrets.IG_TOKEN_REPARUM }}
          IG_CONTA: reparumtech
          SLOT_MANUAL: ${{ github.event.inputs.slot }}
          CRON_AGENDADO: ${{ github.event.schedule }}
        run: |
          if [ "$SLOT_MANUAL" = "validar" ]; then
            node publicador/reparum-stories.mjs --validar
          elif [ "$SLOT_MANUAL" = "conferir-token" ]; then
            node publicador/reparum-stories.mjs --conferir-token
          elif [ "$SLOT_MANUAL" = "auditar" ]; then
            node publicador/reparum-stories.mjs --auditar
          elif [ -n "$SLOT_MANUAL" ]; then
            node publicador/reparum-stories.mjs --slot "$SLOT_MANUAL"
          elif [ "$CRON_AGENDADO" = "0,15,30 12 * * *" ]; then
            node publicador/reparum-stories.mjs --slot 09
          elif [ "$CRON_AGENDADO" = "0,15,30 17 * * *" ]; then
            node publicador/reparum-stories.mjs --slot 14
          elif [ "$CRON_AGENDADO" = "0,15,30 20 * * *" ]; then
            node publicador/reparum-stories.mjs --slot 17
          else
            echo "gatilho sem slot reconhecido; abortando por segurança"
            exit 1
          fi

      - name: Guardar histórico anti-repetição
        if: always()
        run: |
          if [ -n "$(git status --porcelain publicador/reparum-estado.json)" ]; then
            git config user.name "publicador"
            git config user.email "publicador@users.noreply.github.com"
            git add publicador/reparum-estado.json
            git commit -m "reparum: estado após $(date -u +%Y-%m-%dT%H:%MZ)"
            # Outro workflow também versiona sua própria fila. Rebase evita que
            # uma mudança simultânea impeça o estado anti-repetição de chegar ao main.
            for tentativa in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "push concorreu com outra execução; tentativa $tentativa/3"
            done
            exit 1
          else
            echo "estado sem alteração"
          fi
