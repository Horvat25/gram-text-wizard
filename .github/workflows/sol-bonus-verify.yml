name: Verify ten SOL Facebook reels
on:
  push:
    branches: [main]
    paths: [publicador/sol-bonus-verify.mjs]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          git config user.name 'SOL publisher'
          git config user.email 'publisher@users.noreply.github.com'
          node publicador/sol-bonus-verify.mjs
