name: Metricas do Instagram

# POR QUE EXISTE: o IG_TOKEN e secret do GitHub e nao desce pra maquina do Marcelo.
# Sem isto, a operacao publica no Instagram mas e CEGA pros numeros de la — e escolhe
# tema, duracao e gancho usando so a regua do YouTube. O robo roda onde o token vive
# e grava `publicador/metricas.json` no proprio repositorio, que qualquer um le depois
# sem credencial nenhuma.

on:
  schedule:
    # 1x por dia, 09:20 UTC (06h BRT). Fora dos horarios de publicacao pra nao
    # concorrer com o publicador. O cron do GitHub atrasa ~45min — nao importa aqui.
    - cron: '20 9 * * *'
  workflow_dispatch:

concurrency:
  group: metricas-instagram
  cancel-in-progress: false

jobs:
  metricas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Puxar os numeros
        env:
          IG_USER_ID: '17841478894893058'   # @neuralupdate — identificador publico, nao e segredo
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node publicador/metricas-instagram.mjs

      - name: Guardar o resultado
        if: always()
        run: |
          set -e
          if [ -z "$(git status --porcelain publicador/metricas.json)" ]; then
            echo "nada mudou"; exit 0
          fi
          git config user.name  "publicador"
          git config user.email "publicador@users.noreply.github.com"

          # ⚠️ Este job empurra pro MESMO branch que o publicador. Em 20/08/2026 um
          # push cego neste repositorio custou um Reels publicado DUAS vezes. Aqui o
          # arquivo e regerado inteiro a cada rodada, entao basta reaplicar por cima
          # do que estiver no GitHub — mas NUNCA sem reconciliar antes.
          cp publicador/metricas.json /tmp/metricas-minha.json
          for tentativa in 1 2 3 4 5; do
            git fetch -q origin main
            git reset --hard -q origin/main
            cp /tmp/metricas-minha.json publicador/metricas.json
            git add publicador/metricas.json
            if git diff --cached --quiet; then echo "ja estava igual"; exit 0; fi
            git commit -q -m "metricas: numeros do Instagram em $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then echo "salvo (tentativa $tentativa)"; exit 0; fi
            echo "push rejeitado; tentando de novo"
            sleep 5
          done
          echo "::error::nao consegui salvar as metricas"
          exit 1
